server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the backend service.
  # In docker-compose this resolves to the "backend" container;
  # in Kubernetes it resolves to the "backend" Service.
  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_set_header Host $host;
  }
}
