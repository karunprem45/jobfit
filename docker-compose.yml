services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGUSER: jobfit
      PGPASSWORD: jobfit
      PGDATABASE: jobfit
    # Wait for Postgres to accept connections before starting the API.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
