services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml:
    build: ./ml
    # Internal service — the backend reaches it as http://ml:8000 over the
    # compose network. Host port 8001 is exposed only for local debugging.
    ports:
      - "8001:8000"

  backend:
    build: ./backend
    environment:
      ML_URL: http://ml:8000
      PGHOST: db
      PGUSER: jobfit
      PGPASSWORD: jobfit
      PGDATABASE: jobfit
    # Wait for Postgres to accept connections before starting the API.
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
